# Make bare PostgREST look like Supabase to supabase-js.
#
# supabase-js addresses PostgREST under `/rest/v1` and sends `apikey` and
# `Authorization` headers. PostgREST serves at `/` and, with no JWT secret
# configured, would try to interpret a bearer token it cannot verify. Stripping
# the prefix and both headers is what lets every client — API, ingest worker,
# tests — point at this with its real, unmodified Supabase code.

server {
    listen 8000;
    server_name _;

    # Trailing slash on proxy_pass strips the matched prefix.
    location /rest/v1/ {
        proxy_pass http://postgrest:3000/;
        proxy_set_header Host $host;
        proxy_set_header apikey "";
        proxy_set_header Authorization "";
        proxy_set_header Accept-Profile $http_accept_profile;
        proxy_set_header Content-Profile $http_content_profile;
        # Ingest sends bounded batches that are large but not streamed.
        client_max_body_size 32m;
    }

    # Anything else is a Supabase service this stack does not run (auth,
    # storage, realtime). Fail loudly rather than 404ing into confusion.
    location / {
        default_type application/json;
        return 501 '{"error":"Only /rest/v1 is served by the local stack","code":"NOT_IMPLEMENTED"}';
    }
}

# The same shim over the throwaway test database. Separate port rather than
# separate host so a test run cannot reach the dev catalogue by fumbling a
# hostname — the two are only ever one digit apart in a URL, never in a name.
server {
    listen 8001;
    server_name _;

    location /rest/v1/ {
        proxy_pass http://postgrest-test:3000/;
        proxy_set_header Host $host;
        proxy_set_header apikey "";
        proxy_set_header Authorization "";
        client_max_body_size 32m;
    }

    location / {
        default_type application/json;
        return 501 '{"error":"Only /rest/v1 is served by the local stack","code":"NOT_IMPLEMENTED"}';
    }
}
