name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Scans the commits being pushed or proposed for anything that looks like a
  # credential. `.dev.vars.local` files are committed on purpose and hold
  # docker placeholders, which the default rules do not match.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action scans `<BASE_REF>^..<head>` and defaults BASE_REF to the
          # oldest commit in the event. A root commit has no `^`, which is what
          # #166 (the TTS subtree import) hit. The base branch tip always has
          # a parent, so scan from there; on a push, `before` is all zeros for
          # a new branch, and scanning from the head alone is the fallback.
          BASE_REF: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}
