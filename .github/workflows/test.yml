name: Test

on:
  push:
    branches: [main]
  pull_request:

env:
  BUN_VERSION: "1.2.0"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: riftseer
          POSTGRES_PASSWORD: postgres
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d riftseer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      postgrest:
        image: postgrest/postgrest:v14.16
        env:
          PGRST_DB_URI: postgres://postgres:postgres@postgres:5432/riftseer
          PGRST_DB_SCHEMA: public
          PGRST_DB_ANON_ROLE: service_role
        ports:
          - 3001:3000

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Load database test schema and fixture
        env:
          RIFTSEER_DATABASE_URL: postgres://postgres:postgres@localhost:55433/riftseer
        run: bun scripts/database-tests/database.mjs setup

      - name: Run tests
        env:
          RIFTSEER_DATABASE_TESTS: "1"
          RIFTSEER_DATABASE_URL: postgres://postgres:postgres@localhost:55433/riftseer
          RIFTSEER_POSTGREST_URL: http://localhost:3001
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Most documentation rot is a name that no longer resolves, and a grep
      # catches every one of those.
      - name: Check guidance files for dangling references
        run: node scripts/check-docs-references.mjs

      # AGENTS.md is a symlink to CLAUDE.md. It used to be a byte-identical
      # copy kept in sync by hand, which is a process guarding a problem that
      # a symlink does not have.
      - name: Check AGENTS.md is still a symlink to CLAUDE.md
        run: |
          test -L AGENTS.md || { echo "AGENTS.md must be a symlink to CLAUDE.md"; exit 1; }
          test "$(readlink AGENTS.md)" = "CLAUDE.md" || { echo "AGENTS.md points at $(readlink AGENTS.md), not CLAUDE.md"; exit 1; }
