name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "packages/**/docs/**"
      - "apps/api/**"
      - "supabase/docs/**"
      - ".github/workflows/docs.yml"
      # docs/ is a workspace member, so lockfile maintenance re-resolves its
      # dependency tree in the root lockfile without touching any path above.
      # #156 did exactly that and broke Mermaid SSR unnoticed.
      - "bun.lock"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "packages/**/docs/**"
      - "apps/api/**"
      - "supabase/docs/**"
      - ".github/workflows/docs.yml"
      # docs/ is a workspace member, so lockfile maintenance re-resolves its
      # dependency tree in the root lockfile without touching any path above.
      # #156 did exactly that and broke Mermaid SSR unnoticed.
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Copy the committed OpenAPI spec into the site
        run: cp apps/api/openapi.json docs/static/openapi.json

      - name: Build docs
        working-directory: docs
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1 (Node 24)
